name: Notify Test

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -X POST -H "Content-Type: application/json" -d '{"content": "${{ github.actor}}さんが ${{ github.ref_name }} ブランチにpushしました。message: ${{github.event.head_commit.message }}"}' ${{ secrets.DISCORD_WEBHOOK_URL }}